services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Definir DB_NAME}
      MYSQL_USER: ${DB_USER:?Definir DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - appointment-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  appointment:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Definir DB_NAME}
      DB_USER: ${DB_USER:?Definir DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      APP_PORT: 8080
      CATALOG_BASE_URL: http://catalog:8080
      CATEDRA_BASE_URL: ${CATEDRA_BASE_URL:?Definir CATEDRA_BASE_URL}
      CATEDRA_GROUP_ID: ${CATEDRA_GROUP_ID:?Definir CATEDRA_GROUP_ID}
      JWT_PRIVATE_KEY_PATH: /run/secrets/private.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AVAILABILITY_TIME_ZONE: ${AVAILABILITY_TIME_ZONE:-America/Argentina/Buenos_Aires}
      AVAILABILITY_HTTP_TIMEOUT: ${AVAILABILITY_HTTP_TIMEOUT:-5s}
    volumes:
      - type: bind
        source: ${JWT_PRIVATE_KEY_PATH:?Definir JWT_PRIVATE_KEY_PATH}
        target: /run/secrets/private.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    networks:
      - default
      - services
    depends_on:
      mysql:
        condition: service_healthy

networks:
  default: {}
  services:
    name: prog2-services
    external: true

volumes:
  appointment-mysql-data:
