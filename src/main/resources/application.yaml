spring:
  application:
    name: appointment
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME}?connectTimeout=5000&socketTimeout=10000
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    connect-retries: 0
    # El DDL puede tardar más que una consulta; no ampliar el límite del pool de aplicación.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME}?connectTimeout=5000&socketTimeout=60000
    user: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  port: ${APP_PORT:8081}

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never

logging:
  level:
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN

app:
  reservation:
    http-timeout: ${RESERVATION_HTTP_TIMEOUT:5s}
    metadata-timeout: ${RESERVATION_METADATA_TIMEOUT:5s}
    attempts: ${RESERVATION_ATTEMPTS:3}
    retry-delay: ${RESERVATION_RETRY_DELAY:5s}
    preparation-cooldown: ${RESERVATION_PREPARATION_COOLDOWN:30s}
  availability:
    time-zone: ${AVAILABILITY_TIME_ZONE:America/Argentina/Buenos_Aires}
    http-timeout: ${AVAILABILITY_HTTP_TIMEOUT:5s}
