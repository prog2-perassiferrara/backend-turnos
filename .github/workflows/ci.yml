name: CI y calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Cambiar el destino a main activa CI; editar título/descripción también lo repite.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-analyze:
    name: Pruebas y análisis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código e historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Java 25 y caché Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers administra su propio MySQL; no requiere Compose ni .env.
      - name: Compilar, probar y generar cobertura
        run: ./mvnw -B -ntp clean verify

      # GitHub no entrega secretos a forks. Sus pruebas se ejecutan igualmente.
      - name: Publicar análisis y cobertura en SonarQube Cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configurar el secreto SONAR_TOKEN en el repositorio."
            exit 1
          fi
          ./mvnw -B -ntp sonar:sonar
